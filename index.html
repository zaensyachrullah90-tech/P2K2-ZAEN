<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>E-Absensi P2K2 - Vercel Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased select-none">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // === PENTING: GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA ===
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxS9UD8eLc64UpwbfCk4OVOqtQxyQi2EZFJBzjiTa8TWCYL3CEQECRU9TjJZXMK962enQ/exec";

    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const currentMonthIndex = new Date().getMonth();
    const currentMonthName = monthNames[currentMonthIndex];

    function AppAbsensi() {
      const [dataSheets, setDataSheets] = useState({});
      const [selectedSheet, setSelectedSheet] = useState('');
      const [loading, setLoading] = useState(true);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      useEffect(() => {
        const goOnline = () => setIsOnline(true);
        const goOffline = () => setIsOnline(false);
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => {
          window.removeEventListener('online', goOnline);
          window.removeEventListener('offline', goOffline);
        };
      }, []);

      useEffect(() => {
        // Ambil dari LocalStorage jika offline (Kebal Blank Spot Sinyal)
        const cached = localStorage.getItem('v_absen_cache');
        if (cached) {
          const parsed = JSON.parse(cached);
          setDataSheets(parsed);
          setSelectedSheet(Object.keys(parsed)[0] || '');
          setLoading(false);
        }

        // Ambil data real-time via API fetch
        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_data' })
        })
        .then(res => res.json())
        .then(resData => {
          if (resData.status === "success") {
            setDataSheets(resData.data);
            localStorage.setItem('v_absen_cache', JSON.stringify(resData.data));
            if (Object.keys(resData.data).length > 0 && !selectedSheet) {
              setSelectedSheet(Object.keys(resData.data)[0]);
            }
          }
          setLoading(false);
        })
        .catch(err => {
          console.log("Mode Offline Aktif");
          setLoading(false);
        });
      }, []);

      const handleAbsenSubmit = (nama, hadir, keterangan) => {
        const payload = { action: 'submit_absen', sheetName: selectedSheet, nama, hadir, keterangan, monthIndex: currentMonthIndex };

        if (!navigator.onLine) {
          let queue = JSON.parse(localStorage.getItem('v_absen_queue') || '[]');
          queue.push(payload);
          localStorage.setItem('v_absen_queue', JSON.stringify(queue));
          alert("Data tersimpan di memori lokal HP! Akan otomatis disinkronkan saat Anda kembali mendapatkan sinyal internet.");
          return;
        }

        // Kirim data senyap di background (Zero Loading / Tanpa Loading Screen)
        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "error") alert("Gagal memperbarui database: " + res.message);
        })
        .catch(err => console.error("Koneksi bermasalah:", err));
      };

      if (loading && Object.keys(dataSheets).length === 0) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="text-center space-y-2">
              <div className="w-9 h-9 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="text-xs font-semibold text-slate-400">Menghubungkan ke Database PKH...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12">
          {/* Header Efek Glossy / Glassmorphism */}
          <header className="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-slate-100 p-4 shadow-xs flex justify-between items-center">
            <div>
              <h1 className="text-base font-bold text-slate-900 tracking-tight">E-Absensi Portal</h1>
              <p className="text-[11px] text-slate-400 font-medium">Bulan Kehadiran: <span className="text-indigo-600 font-bold">{currentMonthName}</span></p>
            </div>
            <div>
              {isOnline ? (
                <span className="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded-full border border-emerald-200">Koneksi Stabil</span>
              ) : (
                <span className="text-[10px] bg-rose-50 text-rose-600 font-bold px-2.5 py-1 rounded-full border border-rose-200">Offline Mode</span>
              )}
            </div>
          </header>

          <main className="max-w-md mx-auto px-4 mt-5 space-y-4">
            {/* Dropdown Wilayah */}
            <div className="bg-white p-3 rounded-xl border border-slate-100 shadow-xs">
              <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Pilih Kelompok / Sheet</label>
              <select 
                className="w-full bg-slate-50 p-2.5 rounded-lg font-bold text-sm text-slate-800 border border-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                value={selectedSheet}
                onChange={(e) => setSelectedSheet(e.target.value)}
              >
                {Object.keys(dataSheets).map((name) => (
                  <option key={name} value={name}>{name}</option>
                ))}
              </select>
            </div>

            {/* List Data Penerima */}
            <div className="space-y-3">
              {dataSheets[selectedSheet] && dataSheets[selectedSheet].slice(1).map((row, idx) => {
                const nama = row[1];
                const alamat = row[2] || "Alamat belum diatur";
                if (!nama) return null;

                return (
                  <CardKomponen 
                    key={selectedSheet + '-' + idx}
                    nama={nama}
                    alamat={alamat}
                    onSimpan={handleAbsenSubmit}
                  />
                );
              })}
            </div>
          </main>
        </div>
      );
    }

    function CardKomponen({ nama, alamat, onSimpan }) {
      const [hadir, setHadir] = useState(true);
      const [keterangan, setKeterangan] = useState('');
      const [terkirim, setTerkirim] = useState(false);

      const handleKlik = () => {
        setTerkirim(true); // Optimistic UI: langsung sukses di HP user tanpa jeda loading internet
        onSimpan(nama, hadir, keterangan);
      };

      if (terkirim) {
        return (
          <div className="p-3.5 bg-emerald-50/70 border border-emerald-100 rounded-xl flex items-center gap-3 transition-all">
            <div className="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold">✓</div>
            <div>
              <p className="text-xs font-bold text-emerald-800">{nama}</p>
              <p className="text-[10px] text-emerald-600">Berhasil diperbarui</p>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-xs space-y-3">
          <div>
            <h3 className="font-bold text-slate-900 text-sm">{nama}</h3>
            <p className="text-[11px] text-slate-400 font-medium">{alamat}</p>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <button 
              type="button" 
              onClick={() => setHadir(true)}
              className={`py-2 rounded-lg font-bold text-xs border transition-all ${hadir ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
            >
              Hadir
            </button>
            <button 
              type="button" 
              onClick={() => setHadir(false)}
              className={`py-2 rounded-lg font-bold text-xs border transition-all ${!hadir ? 'bg-rose-500 text-white border-rose-500 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
            >
              Absen
            </button>
          </div>

          {!hadir && (
            <input 
              type="text" 
              placeholder="Sakit, Izin, Tanpa Kabar..."
              className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500"
              value={keterangan}
              onChange={(e) => setKeterangan(e.target.value)}
            />
          )}

          <button 
            type="button" 
            onClick={handleKlik}
            className="w-full py-2 bg-slate-900 text-white font-bold text-xs rounded-lg hover:bg-indigo-600 transition-all active:scale-[0.99]"
          >
            Kunci Kehadiran
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppAbsensi />);
  </script>
</body>
</html>
